name: Web → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tentukan base URL (sub-path repo, kosong untuk <user>.github.io)
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then echo "url=" >> "$GITHUB_OUTPUT"; else echo "url=/$REPO" >> "$GITHUB_OUTPUT"; fi
      - name: Export web (SPA)
        env:
          EXPO_PUBLIC_BASE_URL: ${{ steps.base.outputs.url }}
          EXPO_NO_TELEMETRY: 1
          CI: 1
        run: |
          npx expo export --platform web
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
